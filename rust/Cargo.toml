[package]
name = "universal-validator"
version = "2.0.0"
edition = "2021"
authors = ["Parthiv Rawat"]
license = "MIT"
description = "Comprehensive data validation library for API, database, and form contexts"
repository = "https://github.com/parthivrawat/universal-validator"
homepage = "https://github.com/parthivrawat/universal-validator"
documentation = "https://docs.rs/universal-validator"
readme = "README.md"
keywords = ["validation", "validator", "schema", "data-validation", "type-safe"]
categories = ["data-structures", "development-tools"]

[dependencies]
regex = "1.10"
serde_json = "1.0"
