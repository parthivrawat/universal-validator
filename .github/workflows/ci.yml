name: CI

on:
  push:
  pull_request:

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifests match VERSION
        run: |
          set -euo pipefail
          expected=$(tr -d '[:space:]' < VERSION)
          for f in python/pyproject.toml rust/Cargo.toml typescript/package.json; do
            actual=$(grep -m1 -oP 'version\s*=\s*"\K[^"]+|"version":\s*"\K[^"]+' "$f")
            echo "$f: $actual (expected $expected)"
            [ "$actual" = "$expected" ]
          done

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: gofmt check
        run: test -z "$(gofmt -l go/)"
      - name: vet
        run: cd go && go vet ./...
      - name: test
        run: cd go && go test ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: pip install -e "python[dev]"
      - name: lint
        run: ruff check python/
      - name: test
        run: cd python && python -m pytest -q

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt check
        run: cargo fmt --check --manifest-path rust/Cargo.toml
      - name: clippy
        run: cargo clippy --manifest-path rust/Cargo.toml -- -D warnings
      - name: test
        run: cargo test --manifest-path rust/Cargo.toml

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install
        working-directory: typescript
        run: npm install
      - name: typecheck
        working-directory: typescript
        run: npx tsc --noEmit
      - name: test
        working-directory: typescript
        run: npx vitest run
